name: CI - Quality Gates & SonarQube

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code Quality Analysis Job
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Resolve diff range for filename guard
      id: diff-range
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        else
          BASE_SHA="${{ github.event.before }}"
        fi
        HEAD_SHA="${{ github.sha }}"

        if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
          BASE_SHA="$(git rev-list --max-count=1 HEAD^ || true)"
        fi

        echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
        echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

    - name: Guard against duplicate-suffix filenames
      shell: bash
      run: |
        chmod +x scripts/check_duplicate_suffix_files.sh
        scripts/check_duplicate_suffix_files.sh "${{ steps.diff-range.outputs.base_sha }}" "${{ steps.diff-range.outputs.head_sha }}"

    - name: Setup Node.js for Firebase rules tests
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install root npm dependencies
      run: npm install
      
    - name: Setup Java 21 for Firebase emulators
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
      
    - name: Run Firebase rules regression tests
      run: npm run test:rules
      
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
      with:
        flutter-version: '3.35.5'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get

    - name: Run conversation quality metrics tests
      run: flutter test --no-pub test/features/messages/services/conversation_quality_metrics_test.dart

    - name: Run golden tests (fail on skipped)
      run: |
        flutter test test/golden --reporter expanded 2>&1 | tee /tmp/golden.out
        # Detect skipped tests using two independent signals so the check
        # survives if Flutter changes the expanded reporter format:
        #   1. Progress token ~N: (e.g. "+10 ~2:") — current format
        #   2. Summary line "Some tests were skipped" — English fallback
        if grep -E '~[1-9][0-9]*:|Some tests were skipped' /tmp/golden.out >/dev/null; then
          echo "::error::Golden tests contain skipped cases"
          exit 1
        fi
      
    - name: Enforce analyzer threshold
      run: |
        set +e
        OUTPUT=$(flutter analyze --no-fatal-infos 2>&1)
        STATUS=$?
        set -e
        echo "$OUTPUT" > /tmp/analyzer_output.txt
        echo "Analyzer exit code: $STATUS"
        if [ "$STATUS" -ne 0 ]; then
          echo "::error::Analyzer reported warnings or errors"
          exit 1
        fi
        echo "Analyzer passed with only non-fatal info suggestions, if any"

    - name: Check code formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: Generate analysis report
      run: |
        echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Static Analysis" >> $GITHUB_STEP_SUMMARY
        cat /tmp/analyzer_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No analyzer output available" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Code Formatting" >> $GITHUB_STEP_SUMMARY
        dart format --output=none --set-exit-if-changed . >> $GITHUB_STEP_SUMMARY 2>&1 || true

  # SonarQube Analysis Job
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0  # Full history needed for SonarQube
      
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
      with:
        flutter-version: '3.35.5'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build
      run: flutter build apk --debug
      
    - name: Run tests with coverage
      run: flutter test --coverage
      
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=tosyno87_naijaSingles
          -Dsonar.organization=tosyno87
          -Dsonar.sources=lib
          -Dsonar.tests=test,integration_test
          -Dsonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.gr.dart,**/*.generated.dart,**/*_old.dart,build/**,coverage/**
          -Dsonar.coverage.exclusions=**/*_test.dart
          -Dsonar.dart.coverage.reportPath=coverage/lcov.info
          -Dsonar.newCode.referenceBranch=main
      continue-on-error: true
      
    - name: SonarQube Quality Gate Check
      id: sonarqube-quality-gate-check
      uses: SonarSource/sonarqube-quality-gate-action@cb3ed20f9fec62b4c3b8ad9e77656c6adaade913
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true
      
    - name: SonarQube Analysis Summary
      if: always()
      run: |
        echo "## 🔍 SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.sonarqube-quality-gate-check.outcome }}" == "success" ]; then
          echo "✅ Quality Gate: **PASSED**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Quality Gate: **FAILED or SKIPPED**" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube dashboard for details." >> $GITHUB_STEP_SUMMARY
        fi

  # Security Analysis Job
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
      with:
        flutter-version: '3.35.5'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Check for secrets and sensitive data
      run: |
        echo "Checking for potential secrets in code..."
        # Check for hardcoded API keys (exclude Firebase public keys in firebase_options.dart)
        # Firebase API keys are public and safe to include in app bundle
        if grep -r "AIza[0-9A-Za-z_-]" lib/ --exclude-dir=generated 2>/dev/null | grep -v "firebase_options.dart" | grep -v "firebase_options_staging.dart"; then
          echo "⚠️  Potential API key found in code (excluding Firebase public keys)"
          exit 1
        fi
        
        # Check for Firebase config patterns (exclude false positives)
        if grep -r "firebase.*key\|api.*key" lib/ --exclude-dir=generated 2>/dev/null | grep -v "_apiKeyKey\|_key.*=.*'api_key'\|//.*api.*key\|#.*api.*key\|meetup_api/key"; then
          echo "⚠️  Potential Firebase configuration found in code"
          exit 1
        fi
        
        # Check for environment files
        if [ -f ".env" ]; then
          echo "❌ .env file found in repository - this should not be committed!"
          exit 1
        fi
        
        echo "✅ No secrets found in code"
        
    - name: Validate environment configuration
      run: |
        echo "Validating environment configuration..."
        if [ ! -f "env.example" ]; then
          echo "❌ env.example file missing"
          exit 1
        fi
        
        if [ ! -f "lib/config/secure_config.dart" ]; then
          echo "❌ SecureConfig class missing"
          exit 1
        fi
        
        echo "✅ Environment configuration validated"
        
    - name: Check dependencies for vulnerabilities
      run: |
        echo "Checking for dependency vulnerabilities..."
        flutter pub outdated || true
        echo "✅ Dependencies checked"

  # Unit Tests with Coverage
  unit-tests-coverage:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
      with:
        flutter-version: '3.35.5'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run unit tests with coverage
      run: flutter test --coverage
      
    - name: Check coverage threshold
      run: |
        # Install lcov for coverage analysis
        sudo apt-get update
        sudo apt-get install -y lcov || true
        
        # Check if coverage file exists
        if [ ! -f "coverage/lcov.info" ]; then
          echo "⚠️ Coverage file not found, skipping threshold check"
          exit 0
        fi
        
        # Generate coverage report
        genhtml coverage/lcov.info -o coverage/html || true
        
        # Check if coverage is above threshold (70%)
        COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep "lines" | awk '{print $2}' | sed 's/%//' || echo "0")
        echo "Coverage: $COVERAGE%"
        
        if [ "$COVERAGE" != "0" ] && (( $(echo "$COVERAGE < 70" | bc -l 2>/dev/null || echo "1") )); then
          echo "⚠️ Coverage $COVERAGE% is below threshold of 70%"
          echo "This is a warning, not a failure"
        else
          echo "✅ Coverage $COVERAGE% meets threshold"
        fi
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
      with:
        file: coverage/lcov.info
        flags: unit-tests
        name: afropeep-unit-tests
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Build Validation
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, security-analysis, unit-tests-coverage]
    
    strategy:
      matrix:
        platform: [android]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
      with:
        flutter-version: '3.35.5'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build Android APK
      if: matrix.platform == 'android'
      run: flutter build apk --release
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: matrix.platform == 'android'
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

  # Release Gate — blocks merges unless all required checks pass
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests-coverage, build-validation]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Verify release Firebase config
      run: ./scripts/verify_release_firebase_config.sh

    - name: Verify all gates passed
      run: |
        echo "code-quality: ${{ needs.code-quality.result }}"
        echo "unit-tests-coverage: ${{ needs.unit-tests-coverage.result }}"
        echo "build-validation: ${{ needs.build-validation.result }}"

        if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
          echo "::error::Code quality gate failed"
          exit 1
        fi
        if [[ "${{ needs.unit-tests-coverage.result }}" != "success" ]]; then
          echo "::error::Unit tests gate failed"
          exit 1
        fi
        if [[ "${{ needs.build-validation.result }}" != "success" ]]; then
          echo "::error::Build validation gate failed"
          exit 1
        fi

        echo "All release gates passed"

  # Quality Gate Summary (informational, does not block)
  quality-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-analysis, unit-tests-coverage, build-validation, sonarqube, release-gate]
    if: always()
    
    steps:
    - name: Generate Quality Summary
      run: |
        echo "# Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality (analyzer + format) | ${{ needs.code-quality.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Analysis | ${{ needs.security-analysis.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests & Coverage | ${{ needs.unit-tests-coverage.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Validation | ${{ needs.build-validation.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| SonarQube Analysis | ${{ needs.sonarqube.result == 'success' && 'Passed' || 'Skipped/Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Gate** | **${{ needs.release-gate.result == 'success' && 'PASSED' || 'BLOCKED' }}** |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.release-gate.result }}" == "success" ]]; then
          echo "## Release Gate Passed" >> $GITHUB_STEP_SUMMARY
          echo "All required quality gates are green. Safe to merge/deploy." >> $GITHUB_STEP_SUMMARY
        else
          echo "## Release Blocked" >> $GITHUB_STEP_SUMMARY
          echo "One or more required gates failed. Fix issues before merging." >> $GITHUB_STEP_SUMMARY
        fi
