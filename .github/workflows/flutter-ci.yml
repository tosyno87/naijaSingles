name: Flutter CI

# This workflow runs on all PRs to main and any feature branch
on:
  pull_request:
    branches: [ "main", "feature/*" ]
  push:
    branches: [ "main", "feature/*" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v3
      
      # Step 2: Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.3' # Updated to match README (uses Dart 3.5)
          channel: 'stable'
          cache: true
      
      # Step 3: Verify Flutter installation
      - name: Verify Flutter installation
        run: flutter --version
      
      # Step 4: Install dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Step 5: Setup Firebase Emulators
      - name: Setup Firebase Emulators
        run: |
          npm install -g firebase-tools
          firebase setup:emulators:firestore
      
      # Step 6: Create Firebase config files (if needed)
      - name: Create Firebase config files
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        if: env.FIREBASE_CONFIG != ''
        run: |
          echo "$FIREBASE_CONFIG" > lib/firebase_options.dart
      
      # Step 7: Run custom setup script with optimization
      - name: Run setup script with caching
        run: |
          if [ -f .setup-cache ]; then
            echo "Using cached setup"
          else
            ./setup.sh
            touch .setup-cache
          fi
        env:
          FLUTTER_CACHE: ${{ steps.cache.outputs.cache-hit }}
      
      # Step 8: Run static code analysis
      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos
      
      # Step 9: Check for vulnerable dependencies
      - name: Check for vulnerable dependencies
        run: |
          flutter pub outdated
          # Add additional security scanning tools here
      
      # Step 10: Run tests with coverage
      - name: Run tests with coverage
        run: flutter test --coverage
      
      # Step 11: Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
      
      # Step 12: Run location service tests specifically
      - name: Run location service tests
        run: flutter test test/services/location/ || echo "No location tests found"
      
      # Step 13: Build Android APK (debug mode)
      - name: Build Android APK
        run: flutter build apk --debug
      
      # Step 14: Run tests with Firebase emulator
      - name: Run tests with Firebase emulator
        run: |
          firebase emulators:exec "flutter test" --project naijasingles-74a75
      
      # Step 15: Bump version on main branch
      - name: Bump version
        if: github.ref == 'refs/heads/main'
        run: |
          # Get current version from pubspec.yaml
          CURRENT_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //')
          # Extract version parts
          VERSION_PARTS=(${CURRENT_VERSION//./ })
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]%%+*}
          BUILD=${VERSION_PARTS[2]##*+}
          # Increment build number
          NEW_BUILD=$((BUILD + 1))
          # Create new version string
          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$NEW_BUILD"
          # Update pubspec.yaml
          sed -i "s/version: $CURRENT_VERSION/version: $NEW_VERSION/" pubspec.yaml
          echo "Version bumped from $CURRENT_VERSION to $NEW_VERSION"

  # Optional job for iOS build verification
  build-ios:
    name: Build iOS (Debug)
    runs-on: macos-latest
    # This job only runs on pull requests to main branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.3'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build iOS
        run: flutter build ios --debug --no-codesign
