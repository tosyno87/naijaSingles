name: Production Deployment

on:
  push:
    branches: [ main, release/* ]
  # Note: Removed pull_request trigger to prevent duplicate runs
  # PRs should use feature-development.yml workflow for testing
  # Production deployment should only occur on actual merges to main


permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true
          
      - name: Create .env file for CI
        # SonarQube: Values are securely injected from GitHub Secrets (not hard-coded)
        run: |
          cat > .env << EOF
          FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY_PROD }}
          FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY_PROD }}
          FIREBASE_IOS_API_KEY=${{ secrets.FIREBASE_IOS_API_KEY_PROD }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID_PROD }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID_PROD }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET_PROD }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN_PROD }}
          FIREBASE_IOS_CLIENT_ID=${{ secrets.FIREBASE_IOS_CLIENT_ID_PROD }}
          FIREBASE_IOS_BUNDLE_ID=com.app.naijasingles
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY_PROD }}
          APP_ENVIRONMENT=production
          EOF
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        
      - name: Run tests
        run: flutter test --coverage
        
      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  build-and-deploy:
    name: Build and Deploy Production
    runs-on: macos-latest
    needs: test
    # Only runs on push to main/release (not on PRs)
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@c51a66b42363123fa82a6cfe02c60af4281dab93
        with:
          xcode-version: latest-stable
          
      - name: Create .env file for CI
        # SonarQube: Values are securely injected from GitHub Secrets (not hard-coded)
        # Also sync Maps keys into iOS Secrets.xcconfig + assets/env/app.env so
        # TestFlight builds get GMSApiKey (avoids GoogleMap hard crash) and Places HTTP.
        run: |
          cat > .env << EOF
          FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY_PROD }}
          FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY_PROD }}
          FIREBASE_IOS_API_KEY=${{ secrets.FIREBASE_IOS_API_KEY_PROD }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID_PROD }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID_PROD }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET_PROD }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN_PROD }}
          FIREBASE_IOS_CLIENT_ID=${{ secrets.FIREBASE_IOS_CLIENT_ID_PROD }}
          FIREBASE_IOS_BUNDLE_ID=com.app.naijasingles
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY_PROD }}
          GOOGLE_MAPS_WEB_API_KEY=${{ secrets.GOOGLE_MAPS_WEB_API_KEY_PROD || secrets.GOOGLE_MAPS_API_KEY_PROD }}
          APP_ENVIRONMENT=production
          EOF
          # Strip accidental leading whitespace from indented heredoc lines.
          sed -i.bak 's/^[[:space:]]*//' .env && rm -f .env.bak
          python3 tool/sync_maps_secrets_from_env.py
          test -s ios/Flutter/Secrets.xcconfig
          test -s assets/env/app.env
          echo "✅ Maps secrets synced for iOS + Dart assets"
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Cache Flutter dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            ~/.pub-cache
            /tmp/flutter_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            
      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true

      - name: Install CocoaPods (with patched xcodeproj)
        run: |
          git clone --depth 1 https://github.com/CocoaPods/Xcodeproj.git /tmp/xcodeproj
          cd /tmp/xcodeproj && gem build xcodeproj.gemspec
          sudo gem install /tmp/xcodeproj/xcodeproj-*.gem --no-document
          sudo gem install cocoapods --no-document
          cd $GITHUB_WORKSPACE/ios && pod install

      - name: Setup Code Signing with Fastlane Match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Create keychain for code signing
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Set keychain password for Fastlane Match
          security set-keychain-password -p "" build.keychain
          
          # Configure git authentication for certificates repo
          git config --global url."https://$PAT_TOKEN@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://$PAT_TOKEN@github.com" > ~/.git-credentials
          
                 # Use Fastlane Match for code signing (best practice for CI)
                 cd ios
                 bundle exec fastlane match appstore --readonly --verbose
          
          # Configure Xcode project for manual signing with Match profile
          # Find the correct target ID by matching the Runner.app product reference (most reliable)
          TARGET_ID=$(grep -B 20 'productReference = .*Runner\.app' ../ios/Runner.xcodeproj/project.pbxproj | grep '^\s*[A-Z0-9]\{24\}' | head -1 | awk '{print $1}')
          
          if [ -n "$TARGET_ID" ]; then
            echo "✅ Found Runner app target ID: $TARGET_ID"
            
            # Get the buildConfigurationList ID from the target (more future-proof)
            CONFIG_LIST_ID=$(awk "/$TARGET_ID/,/}/" ../ios/Runner.xcodeproj/project.pbxproj | grep buildConfigurationList | awk '{print $3}' | tr -d ";")
            echo "🔍 Found buildConfigurationList ID: $CONFIG_LIST_ID"
            
            # Validate buildConfigurationList was found
            if [ -z "$CONFIG_LIST_ID" ]; then
              echo "❌ Could not find buildConfigurationList for target: $TARGET_ID"
              exit 1
            fi
            
            # Get all config IDs from the list (look for buildConfigurations section)
            CONFIG_IDS=$(awk "/$CONFIG_LIST_ID.*=.*{/,/);/" ../ios/Runner.xcodeproj/project.pbxproj | grep -A 10 "buildConfigurations" | grep -E "^[[:space:]]*[A-Z0-9]{24}" | awk '{print $1}')
            
            for CONFIG_ID in $CONFIG_IDS; do
              echo "🛠️ Updating build config: $CONFIG_ID"
              /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:CODE_SIGN_STYLE Manual" ../ios/Runner.xcodeproj/project.pbxproj
              /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:CODE_SIGN_IDENTITY 'Apple Distribution'" ../ios/Runner.xcodeproj/project.pbxproj
              /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:PROVISIONING_PROFILE_SPECIFIER 'match AppStore com.app.naijasingles'" ../ios/Runner.xcodeproj/project.pbxproj
            done
            
            echo "✅ Successfully set manual signing for all build configs"
          else
            echo "❌ Could not find Runner target ID"
            exit 1
          fi
          
      - name: Auto-increment Build Number
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          echo "🔍 Fetching latest build number from App Store Connect..."
          
          # Install jq for JSON parsing (if not already installed)
          brew install jq || true
          
          # Create JWT token for App Store Connect API
          # Create API key file
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s\n" "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
          
          # Generate JWT token (valid for 20 minutes)
          ISSUED_AT=$(date +%s)
          EXP=$((ISSUED_AT + 1200))
          
          # Create JWT header
          HEADER=$(echo -n '{"alg":"ES256","kid":"'$APPSTORE_API_KEY_ID'","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
          
          # Create JWT payload
          PAYLOAD=$(echo -n '{"iss":"'$APPSTORE_API_ISSUER_ID'","iat":'$ISSUED_AT',"exp":'$EXP',"aud":"appstoreconnect-v1"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
          
          # Create signature
          SIGNATURE=$(echo -n "$HEADER.$PAYLOAD" | openssl dgst -sha256 -sign ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8 -binary | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
          
          JWT="$HEADER.$PAYLOAD.$SIGNATURE"
          
          echo "✅ JWT token generated"
          
          # Get app ID from bundle identifier
          APP_RESPONSE=$(curl -s -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.app.naijasingles" || echo '{"data":[]}')
          
          echo "📋 API Response: $APP_RESPONSE" | head -c 200
          echo ""
          
          APP_ID=$(echo "$APP_RESPONSE" | jq -r '.data[0].id // "null"' 2>/dev/null || echo "null")
          echo "📱 App ID: $APP_ID"
          
          # Get latest build for this app
          if [ "$APP_ID" != "null" ] && [ -n "$APP_ID" ]; then
            BUILDS_RESPONSE=$(curl -s -H "Authorization: Bearer $JWT" \
              "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$APP_ID&sort=-uploadedDate&limit=1" || echo '{"data":[]}')
            
            CURRENT_BUILD=$(echo "$BUILDS_RESPONSE" | jq -r '.data[0].attributes.version // "0"' 2>/dev/null || echo "0")
            
            # Handle non-numeric values
            if ! [[ "$CURRENT_BUILD" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Invalid build number: $CURRENT_BUILD, defaulting to 0"
              CURRENT_BUILD=0
            fi
            
            echo "📊 Current build in App Store Connect: $CURRENT_BUILD"
          else
            echo "ℹ️ App not found or no builds yet, starting from build 1"
            CURRENT_BUILD=0
          fi
          
          # Increment build number
          NEW_BUILD=$((CURRENT_BUILD + 1))
          echo "🚀 New build number will be: $NEW_BUILD"
          
          # Update pubspec.yaml with new build number
          CURRENT_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: \(.*\)+.*/\1/')
          sed -i.bak "s/version: .*+.*/version: ${CURRENT_VERSION}+${NEW_BUILD}/" pubspec.yaml
          
          # Also update iOS Info.plist to ensure it's synced
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" ios/Runner/Info.plist 2>/dev/null || echo "⚠️ Could not update Info.plist (may use Flutter variable)"
          
          # Update Xcode project version
          sed -i.bak "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $NEW_BUILD/g" ios/Runner.xcodeproj/project.pbxproj
          
          echo "✅ Updated pubspec.yaml to: $(grep 'version:' pubspec.yaml)"
          echo "✅ Updated Info.plist CFBundleVersion to: $NEW_BUILD"
          echo "✅ Updated Xcode CURRENT_PROJECT_VERSION to: $NEW_BUILD"
          
      - name: Build iOS Release with Fastlane
        env:
          SKIP_FLUTTER_CLEAN: "true"
        run: |
          ./scripts/verify_release_firebase_config.sh
          flutter pub get
          flutter build ios --release --dart-define=ENV=production --no-codesign
          chmod +x scripts/verify_ios_gms_api_key.sh
          ./scripts/verify_ios_gms_api_key.sh
          cd ios
          bundle exec fastlane build_app
        
      - name: Deploy to App Store Connect
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # Use xcrun altool directly to bypass Fastlane OpenSSL issues
          # Create API key file in the expected location for altool
          mkdir -p ~/.appstoreconnect/private_keys
          
          echo "🔍 Debugging API key setup..."
          echo "Key ID: $APPSTORE_API_KEY_ID"
          echo "Issuer ID: $APPSTORE_API_ISSUER_ID"
          echo "Private key length: $(echo "$APPSTORE_API_PRIVATE_KEY" | wc -c) characters"
          
          # Create the AuthKey file with NO leading whitespace
          # Using printf instead of cat to ensure exact formatting
          printf "%s\n" "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
          
          # Verify the file format
          echo "🔍 Verifying AuthKey file..."
          if head -1 ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8 | grep -q "BEGIN PRIVATE KEY"; then
            echo "✅ File starts correctly"
          else
            echo "❌ File does NOT start with BEGIN PRIVATE KEY"
            echo "First line:"
            head -1 ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
            exit 1
          fi
          
          if tail -1 ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8 | grep -q "END PRIVATE KEY"; then
            echo "✅ File ends correctly"
          else
            echo "❌ File does NOT end with END PRIVATE KEY"
            echo "Last line:"
            tail -1 ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
            exit 1
          fi
          
          echo "✅ AuthKey file format verified"
          echo "File line count: $(wc -l < ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8)"
          
          # Find the IPA file
          IPA_FILE=$(find . -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ No IPA file found"
            exit 1
          fi
          
          echo "📱 Found IPA file: $IPA_FILE"
          
          # Upload using App Store Connect API directly (bypasses Fastlane OpenSSL issues)
          echo "🚀 Starting upload to App Store Connect..."
          
          # First upload attempt - may fail due to version conflict
          UPLOAD_OUTPUT=$(xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID" \
            --verbose 2>&1) || true
          
          echo "$UPLOAD_OUTPUT"
          
          # Check if upload succeeded
          if echo "$UPLOAD_OUTPUT" | grep -q "No errors uploading"; then
            echo "✅ Upload successful!"
            exit 0
          fi
          
          # Check if it's a version conflict error
          if echo "$UPLOAD_OUTPUT" | grep -q "previousBundleVersion"; then
            PREVIOUS_BUILD=$(echo "$UPLOAD_OUTPUT" | grep -o 'previousBundleVersion[[:space:]]*:[[:space:]]*[0-9]*' | grep -o '[0-9]*$' | head -1)
            
            if [ -n "$PREVIOUS_BUILD" ] && [ "$PREVIOUS_BUILD" != "0" ]; then
              NEW_BUILD=$((PREVIOUS_BUILD + 1))
              echo "🔄 Version conflict detected!"
              echo "   Previous build: $PREVIOUS_BUILD"
              echo "   Retrying with build: $NEW_BUILD"
              
              # Update pubspec.yaml
              CURRENT_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: \(.*\)+.*/\1/')
              sed -i.bak "s/version: .*+.*/version: ${CURRENT_VERSION}+${NEW_BUILD}/" pubspec.yaml
              echo "✅ Updated pubspec.yaml to: $(grep 'version:' pubspec.yaml)"
              
              # Also update iOS Info.plist directly (critical for version to be picked up)
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" ios/Runner/Info.plist
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $CURRENT_VERSION" ios/Runner/Info.plist
              echo "✅ Updated Info.plist: CFBundleVersion=$NEW_BUILD, CFBundleShortVersionString=$CURRENT_VERSION"
              
              # Rebuild with correct version (must re-apply production dart-define)
              echo "🔨 Rebuilding with correct version..."
              flutter clean
              flutter pub get
              flutter build ios --release --dart-define=ENV=production --no-codesign
              chmod +x scripts/verify_ios_gms_api_key.sh
              ./scripts/verify_ios_gms_api_key.sh
              cd ios
              pod install
              SKIP_FLUTTER_CLEAN=true bundle exec fastlane build_app
              cd ..
              
              # Find the new IPA
              IPA_FILE=$(find . -name "*.ipa" | head -1)
              echo "📱 New IPA: $IPA_FILE"
              
              # Retry upload
              echo "🚀 Retrying upload with build $NEW_BUILD..."
              xcrun altool --upload-app \
                --type ios \
                --file "$IPA_FILE" \
                --apiKey "$APPSTORE_API_KEY_ID" \
                --apiIssuer "$APPSTORE_API_ISSUER_ID" \
                --verbose
              
              echo "✅ Upload successful!"
              exit 0
            fi
          fi
          
          # If we got here, upload failed for another reason
          echo "❌ Upload failed"
          echo "$UPLOAD_OUTPUT"
          exit 1
            
      # Deployment record creation removed - not essential for App Store deployment
      # The actual deployment to App Store Connect is what matters

  # Security scan removed - PRs should use feature-development.yml or ci.yml
  # Production deployment should focus on building and deploying to App Store
