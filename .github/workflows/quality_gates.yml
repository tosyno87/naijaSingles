name: Quality Gates & Security Checks

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code Quality Analysis Job
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.3'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run static analysis
      run: flutter analyze --no-fatal-infos
      continue-on-error: true
      
    - name: Check code formatting
      run: dart format --output=none --set-exit-if-changed .
      continue-on-error: true
      
    - name: Generate analysis report
      run: |
        echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Static Analysis" >> $GITHUB_STEP_SUMMARY
        flutter analyze --no-fatal-infos >> $GITHUB_STEP_SUMMARY 2>&1 || true
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Code Formatting" >> $GITHUB_STEP_SUMMARY
        dart format --output=none --set-exit-if-changed . >> $GITHUB_STEP_SUMMARY 2>&1 || true

  # Security Analysis Job
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.3'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Check for secrets and sensitive data
      run: |
        echo "Checking for potential secrets in code..."
        # Check for hardcoded API keys
        if grep -r "AIza[0-9A-Za-z_-]" lib/ --exclude-dir=generated; then
          echo "⚠️  Potential API key found in code"
          exit 1
        fi
        
        # Check for Firebase config patterns
        if grep -r "firebase.*key\|api.*key" lib/ --exclude-dir=generated; then
          echo "⚠️  Potential Firebase configuration found in code"
          exit 1
        fi
        
        # Check for environment files
        if [ -f ".env" ]; then
          echo "❌ .env file found in repository - this should not be committed!"
          exit 1
        fi
        
        echo "✅ No secrets found in code"
        
    - name: Validate environment configuration
      run: |
        echo "Validating environment configuration..."
        if [ ! -f "env.example" ]; then
          echo "❌ env.example file missing"
          exit 1
        fi
        
        if [ ! -f "lib/config/secure_config.dart" ]; then
          echo "❌ SecureConfig class missing"
          exit 1
        fi
        
        echo "✅ Environment configuration validated"
        
    - name: Check dependencies for vulnerabilities
      run: |
        echo "Checking for dependency vulnerabilities..."
        flutter pub deps
        # Add dependency vulnerability scanning here if needed
        echo "✅ Dependencies checked"

  # Unit Tests with Coverage
  unit-tests-coverage:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.3'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run unit tests with coverage
      run: flutter test --coverage
      
    - name: Check coverage threshold
      run: |
        # Install lcov for coverage analysis
        sudo apt-get update
        sudo apt-get install -y lcov
        
        # Generate coverage report
        genhtml coverage/lcov.info -o coverage/html
        
        # Check if coverage is above threshold (70%)
        COVERAGE=$(lcov --summary coverage/lcov.info | grep "lines" | awk '{print $2}' | sed 's/%//')
        echo "Coverage: $COVERAGE%"
        
        if (( $(echo "$COVERAGE < 70" | bc -l) )); then
          echo "❌ Coverage $COVERAGE% is below threshold of 70%"
          exit 1
        else
          echo "✅ Coverage $COVERAGE% meets threshold"
        fi
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info
        flags: unit-tests
        name: naijasingles-unit-tests
        fail_ci_if_error: false

  # Build Validation
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, security-analysis, unit-tests-coverage]
    
    strategy:
      matrix:
        platform: [android]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.3'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build Android APK
      if: matrix.platform == 'android'
      run: flutter build apk --release
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: matrix.platform == 'android'
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

  # Quality Gate Summary
  quality-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-analysis, unit-tests-coverage, build-validation]
    if: always()
    
    steps:
    - name: Generate Quality Summary
      run: |
        echo "# 🎯 Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality Analysis | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Analysis | ${{ needs.security-analysis.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests & Coverage | ${{ needs.unit-tests-coverage.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Validation | ${{ needs.build-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.security-analysis.result }}" == "success" && "${{ needs.unit-tests-coverage.result }}" == "success" && "${{ needs.build-validation.result }}" == "success" ]]; then
          echo "## 🎉 All Quality Gates Passed!" >> $GITHUB_STEP_SUMMARY
          echo "The code is ready for merge/deployment." >> $GITHUB_STEP_SUMMARY
        else
          echo "## ⚠️ Some Quality Gates Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please review and fix the issues before proceeding." >> $GITHUB_STEP_SUMMARY
        fi
