# SonarQube/SonarCloud Project Configuration
# This file configures how SonarQube analyzes your Flutter/Dart project

# Project identification (SonarCloud)
sonar.projectKey=tosyno87_naijaSingles
sonar.organization=tosyno87

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=naijaSingles
sonar.projectVersion=1.0

# Source code location
sonar.sources=lib
sonar.tests=test,integration_test
sonar.sourceEncoding=UTF-8

# Exclusions - files to ignore during analysis
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.gr.dart,**/*.generated.dart,**/*_old.dart,build/**,coverage/**,**/*.md,**/firebase_options*.dart

# Test exclusions
sonar.test.exclusions=**/*_test.dart

# Coverage reports (if using lcov)
sonar.dart.coverage.reportPath=coverage/lcov.info

# Language settings
sonar.language=dart

# New Code Definition
# This can be overridden in SonarQube/SonarCloud UI
# Options:
# - Reference branch: main (recommended for feature branch workflow)
# - Number of days: 30 (for continuous development)
# - Previous version (for versioned releases)
sonar.newCode.referenceBranch=main

# Quality Gate Settings (configured in UI, but documented here)
# Recommended thresholds:
# - Coverage: ≥ 70%
# - Duplicated Lines: < 3%
# - Maintainability Rating: A
# - Reliability Rating: A
# - Security Rating: A
# - Code Smells: < 50

# Analysis parameters
sonar.verbose=false

# Flutter/Dart specific settings
sonar.dart.analyzer.analysisOptions=analysis_options.yaml

