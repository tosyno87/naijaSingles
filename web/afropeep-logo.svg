<svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Heart and Africa Icon -->
  <g id="heart-africa-icon">
    <!-- Heart shape outline in green -->
    <path d="M10 20 C10 15, 15 10, 20 10 C25 10, 30 15, 30 20 C30 25, 25 30, 20 30 C15 30, 10 25, 10 20 Z" 
          fill="none" 
          stroke="#008037" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
    
    <!-- Africa continent silhouette in solid green -->
    <path d="M14 12 C16 10, 19 12, 21 14 C23 16, 24 19, 23 22 C22 25, 19 27, 16 26 C13 25, 11 22, 11 19 C11 16, 12 14, 14 12 Z" 
          fill="#008037"/>
    
    <!-- Heart inner detail -->
    <path d="M14 14 C16 12, 19 14, 21 16 C23 18, 24 21, 23 24 C22 27, 19 29, 16 28 C13 27, 11 24, 11 21 C11 18, 12 16, 14 14 Z" 
          fill="none" 
          stroke="#008037" 
          stroke-width="1" 
          stroke-linecap="round"/>
  </g>
  
  <!-- AfroPeep Text - seamless word -->
  <g id="text">
    <!-- Afro text in black -->
    <text x="35" y="28" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" fill="#000000">Afro</text>
    
    <!-- Peep text in green - directly adjacent -->
    <text x="75" y="28" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" fill="#008037">Peep</text>
  </g>
</svg>
